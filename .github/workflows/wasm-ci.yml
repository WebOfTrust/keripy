name: WASM Tests

on:
  push:
    branches: ['main', 'webbaser']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYODIDE_VERSION: '314.0.5'

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: '3.14'
      - name: Cache WASM dependency wheels
        id: deps
        uses: actions/cache@v6
        with:
          path: wheels/dependencies
          key: wasm-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{
            hashFiles('.github/workflows/wasm-ci.yml', 'tests/wasm/*.sh', 'tests/wasm/*.txt', 'tests/wasm/*.patch') }}
      - name: Build WASM dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        env:
          PYODIDE_XBUILDENV_PATH: ${{ runner.temp }}/pyodide-xbuildenv
          RUSTUP_TOOLCHAIN: 1.97.1
        run: |
          python -m pip install -r tests/wasm/build-requirements.txt
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-emscripten
          pyodide xbuildenv install "$PYODIDE_VERSION"
          pyodide xbuildenv install-emscripten --version 5.0.3
          source "$PYODIDE_XBUILDENV_PATH/$PYODIDE_VERSION/emsdk/emsdk_env.sh"
          export RUST_TOOLCHAIN="$RUSTUP_TOOLCHAIN"
          bash tests/wasm/build-dependencies.sh
      - name: Build Keripy from this checkout
        run: |
          python -m pip install -c tests/wasm/build-requirements.txt build setuptools wheel
          python -m build --wheel --no-isolation --outdir wheels/current
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-wheels
          path: wheels/
          if-no-files-found: error

  wasm-test:
    needs: build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: chrome
            runner: playwright
            playwright_browser: chromium
          - runtime: firefox
            runner: playwright
            playwright_browser: firefox
          - runtime: node
            runner: selenium
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: pyodide/pyodide-actions/download-pyodide@v2
        with:
          version: ${{ env.PYODIDE_VERSION }}
          to: dist
      - name: Install test dependencies
        run: |
          python -m pip install playwright==1.61.0 pytest==9.1.1 pytest-pyodide==0.60.0
      - uses: actions/download-artifact@v8
        with:
          name: wasm-wheels
          path: wheels/
      - name: Install Playwright browser
        if: matrix.runner == 'playwright'
        run: |
          if [ "${{ matrix.playwright_browser }}" = "chromium" ]; then
            python -m playwright install --only-shell chromium
          else
            python -m playwright install ${{ matrix.playwright_browser }}
          fi
      - name: Run Keripy tests in Pyodide 314
        env:
          RUN_WASM_TESTS: "true"
        run: |
          pytest tests/wasm/test_webdbing_wasm.py \
            --confcutdir=tests/wasm \
            --runner ${{ matrix.runner }} \
            --runtime ${{ matrix.runtime }} \
            --dist-dir=./dist/ \
            -v
