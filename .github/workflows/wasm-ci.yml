name: WASM Tests

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  wasm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: chrome
            runner: playwright
            playwright_browser: chromium
          - runtime: firefox
            runner: playwright
            playwright_browser: firefox
          - runtime: node
            runner: selenium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: pyodide/pyodide-actions/download-pyodide@v2
        with:
          version: 314.0.5
          to: dist
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            playwright==1.61.0 \
            pytest==9.1.1 \
            pytest-pyodide==0.59.2 \
            build==1.6.1 setuptools==84.0.0 wheel==0.48.0
      - name: Prepare browser dependencies and current Keripy wheel
        run: |
          curl --fail --location --retry 3 \
            https://github.com/keri-foundation/fortweb/releases/download/keripy-wasm-deps-pyodide-314-hio-0.7.21/keripy-wasm-dependencies.tar.gz \
            --output keripy-wasm-dependencies.tar.gz
          echo 'c44327739283edacaca48acfc4e4c48be6e93898411467c3787a96b1b9beaadb  keripy-wasm-dependencies.tar.gz' | sha256sum --check
          mkdir -p wheels/dependencies
          tar -xzf keripy-wasm-dependencies.tar.gz -C wheels/dependencies
          python -m build --wheel --no-isolation --outdir wheels/current
      - name: Install Playwright browser
        if: matrix.runner == 'playwright'
        run: |
          if [ "${{ matrix.playwright_browser }}" = "chromium" ]; then
            python -m playwright install --only-shell chromium
          else
            python -m playwright install ${{ matrix.playwright_browser }}
          fi
      - name: Run browser storage and Habery tests in Pyodide 314
        env:
          RUN_WASM_TESTS: "true"
        run: |
          pytest tests/wasm/test_webdbing_wasm.py \
            --confcutdir=tests/wasm \
            --runner ${{ matrix.runner }} \
            --runtime ${{ matrix.runtime }} \
            --dist-dir=./dist/ \
            -v
