name: WASM Tests

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  wasm-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: chrome
            runner: playwright
            playwright_browser: chromium
          - runtime: firefox
            runner: playwright
            playwright_browser: firefox
          - runtime: node
            runner: selenium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pyodide/pyodide-actions/download-pyodide@v2
        with:
          version: 0.27.2
          to: dist
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            playwright==1.61.0 \
            pytest-pyodide==0.59.2
          python -m pip download \
            --dest wheels \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r tests/wasm/wheel-requirements.txt
      - name: Install Playwright browser
        if: matrix.runner == 'playwright'
        run: |
          if [ "${{ matrix.playwright_browser }}" = "chromium" ]; then
            python -m playwright install --only-shell chromium
          else
            python -m playwright install ${{ matrix.playwright_browser }}
          fi
      - name: Prepare test directory
        run: |
          cp src/keri/db/webdbing.py ./webdbing.py
      - name: Run WebDBer WASM tests in Pyodide
        env:
          RUN_WASM_TESTS: "true"
        run: |
          pytest tests/wasm/test_webdbing_wasm.py \
            --confcutdir=tests/wasm \
            --runner ${{ matrix.runner }} \
            --runtime ${{ matrix.runtime }} \
            --dist-dir=./dist/ \
            -v
